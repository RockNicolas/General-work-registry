name: rgo

# Desenvolvimento: só o banco sobe no Docker (`docker compose up -d db`); app e worker rodam no host
# com `pnpm dev` e `pnpm worker`. O perfil "app" sobe tudo em contêineres (`--profile app`).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rgo
      POSTGRES_PASSWORD: rgo
      POSTGRES_DB: rgo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rgo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rgo -d rgo"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgres://rgo:rgo@db:5432/rgo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://rgo:rgo@db:5432/rgo
    depends_on:
      db:
        condition: service_healthy

volumes:
  rgo-pgdata:
